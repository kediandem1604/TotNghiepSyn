  <ellipse cx="101" cy="230" rx="14" ry="8.5" fill="#ff9aa8" opacity=".6"/>
  <ellipse cx="199" cy="230" rx="14" ry="8.5" fill="#ff9aa8" opacity=".6"/>
  <path d="M95 231l3-4.5M101 231l3-4.5M107 231l3-4.5M193 231l3-4.5M199 231l3-4.5M205 231l3-4.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>

  <!-- Mũi & miệng cười -->
  <path d="M149 216q1.5 1.6 3 0" fill="none" stroke="#e6a996" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M141 227Q150 243 159 227Q150 230 141 227Z" fill="#c24a5c"/>
  <path d="M145 233.5Q150 239.5 155 233.5Q150 231.5 145 233.5Z" fill="#ff8d9d"/>

  <!-- Lọn tóc hai bên má -->
  <path d="M70 160C56 212 56 268 70 312L80 326L84 302C88 262 86 214 92 176Z" fill="url(#hair)"/>
  <path d="M230 160C244 212 244 268 230 312L220 326L216 302C212 262 214 214 208 176Z" fill="url(#hair)"/>

  <!-- Mái tóc -->
  <path d="M60 196C56 120 100 84 150 84C200 84 244 120 240 196
           Q236 170 228 158Q226 178 214 186Q214 168 206 150Q202 170 186 172Q190 160 180 144Q176 166 160 170
           Q162 156 154 140Q150 132 146 140Q138 156 140 170Q124 166 120 144Q110 160 114 172Q98 170 94 150
           Q86 168 86 186Q74 178 72 158Q64 170 60 196Z" fill="url(#hair)"/>
  <g fill="none" stroke="#4d445c" stroke-width="3" stroke-linecap="round" opacity=".6">
    <path d="M100 132Q114 123 128 126"/><path d="M172 126Q186 123 200 132"/>
  </g>

  <!-- Nơ kẹp tóc đỏ -->
  <g transform="rotate(-18 86 146)">
    <path d="M86 146l-11-7v14zM86 146l11-7v14z" fill="#e03448"/>
    <circle cx="86" cy="146" r="3.4" fill="#b81c30"/>
  </g>

  <!-- Mũ tốt nghiệp đen, tua đỏ -->
  <g transform="rotate(-8 150 80)">
    <path d="M98 92v18q52 18 104 0V92q-52 16-104 0z" fill="#25252d"/>
    <path d="M150 50 244 80 150 110 56 80z" fill="#1c1c23" stroke="#3b3b46" stroke-width="2" stroke-linejoin="round"/>
    <path d="M150 55 234 80" stroke="#55556a" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <path d="M150 80 232 86v38" fill="none" stroke="#d42a3c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M226 124h12l-2 18h-8z" fill="#d42a3c"/>
    <path d="M229 128v12M232 128v12M235 128v12" stroke="#a8172a" stroke-width="1"/>
    <circle cx="150" cy="80" r="5" fill="#d42a3c"/>
  </g>

  <!-- Tay giơ chữ V -->
  <path d="M108 300Q88 294 80 274" fill="none" stroke="#1f1f27" stroke-width="30" stroke-linecap="round"/>
  <ellipse cx="76" cy="268" rx="14" ry="8.5" fill="url(#red)" transform="rotate(47 76 268)"/>
  <rect x="59" y="226" width="8.5" height="25" rx="4.25" fill="#ffe3d4" stroke="#efc6b4" stroke-width="1.4" transform="rotate(-14 63 250)"/>
  <rect x="70" y="224" width="8.5" height="27" rx="4.25" fill="#ffe3d4" stroke="#efc6b4" stroke-width="1.4" transform="rotate(9 74 250)"/>
  <circle cx="70" cy="256" r="11.5" fill="#ffe3d4" stroke="#efc6b4" stroke-width="1.5"/>
  <path d="M63 254q7 4 14 0M61 260q3 3 6 3" fill="none" stroke="#e8b3a0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Tay cầm bằng -->
  <path d="M192 300Q206 312 204 332" fill="none" stroke="#1f1f27" stroke-width="28" stroke-linecap="round"/>
  <ellipse cx="204" cy="336" rx="13.5" ry="8" fill="url(#red)" transform="rotate(-8 204 336)"/>
  <g transform="rotate(-22 196 344)">
    <rect x="150" y="336" width="96" height="16" rx="8" fill="#fffaf0" stroke="#e7dcc4" stroke-width="1.5"/>
    <ellipse cx="246" cy="344" rx="4.5" ry="8" fill="#f4ead6" stroke="#e7dcc4" stroke-width="1.5"/>
    <rect x="167" y="334" width="9" height="20" rx="2" fill="#d42a3c"/>
    <path d="M171.5 334q-12-11-16 0q4 5 16 0zM171.5 334q12-11 16 0q-4 5-16 0z" fill="#e03448"/>
  </g>
  <circle cx="202" cy="344" r="11.5" fill="#ffe3d4" stroke="#efc6b4" stroke-width="1.5"/>
  <path d="M195 341q7-3 13 1" fill="none" stroke="#e8b3a0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Mây phía trước -->
  <g fill="url(#cloud)">
    <circle cx="18" cy="388" r="30"/><circle cx="56" cy="380" r="26"/><circle cx="90" cy="396" r="22"/>
    <circle cx="214" cy="396" r="22"/><circle cx="250" cy="382" r="28"/><circle cx="288" cy="390" r="26"/>
  </g>

  <!-- Tim & lấp lánh -->
  <g fill="#ff8fa3">
    <path d="M42 214c-4-6-12-2-8 5l8 7 8-7c4-7-4-11-8-5z"/>
    <path d="M30 238c-2.6-4-8-1.4-5.3 3.3l5.3 4.7 5.3-4.7c2.7-4.7-2.7-7.3-5.3-3.3z" opacity=".85"/>
  </g>
  <g fill="#fff">
    <path d="M262 236l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" opacity=".95"/>
    <path d="M30 130l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".9"/>
  </g>
  <path d="M262 46l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#f2c46d"/>
</svg>
