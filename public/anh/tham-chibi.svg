<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 300 400" role="img" aria-label="Tranh chibi Thắm đội mũ tốt nghiệp, áo cử nhân đen đỏ, khăn choàng trắng, giơ tay chữ V">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcdfb"/>
      <stop offset=".6" stop-color="#d6edff"/>
      <stop offset="1" stop-color="#fff2ea"/>
    </linearGradient>
    <radialGradient id="sun" cx=".82" cy=".14" r=".42">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="1" stop-color="#fffbea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#342d42"/>
      <stop offset=".5" stop-color="#211b2b"/>
      <stop offset="1" stop-color="#17121f"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d38"/>
      <stop offset="1" stop-color="#131319"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e03448"/>
      <stop offset="1" stop-color="#a8172a"/>
    </linearGradient>
    <radialGradient id="skin" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#fff4ec"/>
      <stop offset="1" stop-color="#ffe0d1"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e120e"/>
      <stop offset=".55" stop-color="#3a231b"/>
      <stop offset="1" stop-color="#9a6448"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6f3ff"/>
    </linearGradient>
  </defs>

  <!-- Trời -->
  <rect width="300" height="400" fill="url(#bg)"/>
  <rect width="300" height="400" fill="url(#sun)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="34" cy="70" r="13"/><circle cx="51" cy="63" r="17"/><circle cx="70" cy="72" r="11"/><rect x="22" y="70" width="58" height="13" rx="6.5"/>
  </g>
  <g fill="#fff" opacity=".7">
    <circle cx="250" cy="196" r="9"/><circle cx="263" cy="190" r="12"/><circle cx="276" cy="197" r="8"/><rect x="242" y="196" width="42" height="9" rx="4.5"/>
  </g>

  <!-- Tóc phía sau -->
  <path d="M150 80C82 80 40 130 42 198C44 252 50 300 44 346Q60 358 76 344Q90 354 104 342H196Q210 354 224 344Q240 358 256 346C250 300 256 252 258 198C260 130 218 80 150 80Z" fill="url(#hair)"/>

  <!-- Áo cử nhân đen -->
  <path d="M70 400C74 330 96 278 150 270C204 278 226 330 230 400Z" fill="url(#robe)"/>
  <!-- Viền trước màu đỏ -->
  <path d="M122 274C132 280 140 290 144 300L142 400H104C106 350 112 306 122 274Z" fill="url(#red)"/>
  <path d="M178 274C168 280 160 290 156 300L158 400H196C194 350 188 306 178 274Z" fill="url(#red)"/>
  <!-- Khăn choàng (sash) trắng viền đỏ -->
  <path d="M124 276C132 284 137 292 139 302L137 400H112C114 352 118 308 124 276Z" fill="#fdfcf8" stroke="#c8213a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M176 276C168 284 163 292 161 302L163 400H188C186 352 182 308 176 276Z" fill="#fdfcf8" stroke="#c8213a" stroke-width="1.8" stroke-linejoin="round"/>
  <g fill="#c8213a" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="11" text-anchor="middle">
    <text x="129" y="320">2</text><text x="128.2" y="333">0</text><text x="127.4" y="346">2</text><text x="126.6" y="359">6</text>
  </g>
  <path d="M171 302q-4 6 0 12t0 12t0 12t0 12" fill="none" stroke="#c8213a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M174 368l1.6 3.6 3.9.4-2.9 2.6.8 3.8-3.4-2-3.4 2 .8-3.8-2.9-2.6 3.9-.4z" fill="#c8213a"/>
  <!-- Cổ, cổ áo và cà vạt trắng -->
  <path d="M139 248h22v26q-11 6-22 0z" fill="#f6cdbb"/>
  <path d="M133 270 150 290 167 270Q150 277 133 270Z" fill="#fff" stroke="#e4e4e4" stroke-width="1"/>
  <path d="M145 286h10l3 28q-8 7-16 0z" fill="#fff" stroke="#e4e4e4" stroke-width="1"/>
  <path d="M150 289v24" stroke="#e8e8e8" stroke-width="1.2"/>

  <!-- Đầu -->
  <!-- Mặt tròn như bánh mochi -->
  <path d="M64 188C64 128 104 98 150 98C196 98 236 128 236 188C236 234 198 262 150 264C102 262 64 234 64 188Z" fill="url(#skin)" stroke="#efc6b4" stroke-width="1.5"/>
  <ellipse cx="150" cy="158" rx="70" ry="16" fill="#f6cdbc" opacity=".5"/>

  <!-- Mắt trái -->
  <ellipse cx="116" cy="198" rx="17" ry="21" fill="url(#iris)"/>
  <ellipse cx="116" cy="191" rx="10.5" ry="11" fill="#140b08" opacity=".5"/>
  <ellipse cx="109" cy="189" rx="6.5" ry="7.5" fill="#fff"/>
  <circle cx="123" cy="207" r="3.2" fill="#fff"/>
  <circle cx="110.5" cy="208" r="1.6" fill="#fff" opacity=".85"/>
  <path d="M97 192Q114 167 135 188" fill="none" stroke="#1a1110" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M98.5 191l-7.5-5" stroke="#1a1110" stroke-width="3" stroke-linecap="round"/>
  <!-- Mắt phải -->
  <ellipse cx="184" cy="198" rx="17" ry="21" fill="url(#iris)"/>
  <ellipse cx="184" cy="191" rx="10.5" ry="11" fill="#140b08" opacity=".5"/>
  <ellipse cx="177" cy="189" rx="6.5" ry="7.5" fill="#fff"/>
  <circle cx="191" cy="207" r="3.2" fill="#fff"/>
  <circle cx="178.5" cy="208" r="1.6" fill="#fff" opacity=".85"/>
  <path d="M165 188Q186 167 203 192" fill="none" stroke="#1a1110" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M201.5 191l7.5-5" stroke="#1a1110" stroke-width="3" stroke-linecap="round"/>

